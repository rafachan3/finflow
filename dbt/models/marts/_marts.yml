version: 2

# The marts docs/SEMANTIC_LAYER.md defines. Generic tests here; the money
# reconciliations are singular tests in dbt/tests/.

models:
  - name: dim_date
    description: One row per day from the first data month to a year past Toronto's today.
    # MetricFlow's time spine: metric_time joins here.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests: [unique, not_null]
      - name: month_start
        data_tests: [not_null]

  - name: fct_transactions
    description: >
      One row per ledger line: each expense line, plus one row per income or
      transfer transaction (its header stands in for its line). amount is the
      line amount, or the header amount for income and transfers. tags holds
      the line's effective tags (its own plus its transaction's). A null
      account name is chequing: deposit_account_name on income,
      from_account_name and to_account_name on a transfer.
    # The MetricFlow semantic model: every metric in docs/SEMANTIC_LAYER.md,
    # by the same name. dbt/scripts/check_metrics.py compares `mf query`
    # with fct_monthly_summary month by month.
    semantic_model: true
    agg_time_dimension: occurred_on
    columns:
      - name: line_key
        entity:
          type: primary
          name: line
        data_tests: [unique, not_null]
      - name: transaction_id
        data_tests: [not_null]
      - name: occurred_on
        description: Every ledger date falls inside the time spine.
        # The mapping form: dbt 1.12.6 drops granularity from `dimension: time`.
        dimension:
          type: time
        granularity: day
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: amount
        data_tests: [not_null]
      - name: type
        dimension: categorical
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [income, expense, transfer]
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: [CAD]
      - name: bucket
        dimension: categorical
        data_tests:
          - not_null:
              config:
                where: "type = 'expense'"
          - accepted_values:
              arguments:
                values: [needs, wants]
      - name: is_recurring
        dimension: categorical
      - name: is_self_funded
        dimension: categorical
        data_tests:
          - not_null:
              config:
                where: "type = 'expense'"
      - name: subcategory_id
        data_tests:
          - not_null:
              config:
                where: "type = 'expense'"
      - name: deposit_account_name
        dimension: categorical
      - name: from_account_name
        dimension: categorical
      - name: to_account_name
        dimension: categorical
      - name: account_kind
        description: Kind of the account a transfer enters (to_account_name).
        dimension: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: [savings, investment, debt]
      - name: from_account_kind
        description: >
          Kind of the account a transfer leaves (from_account_name); never
          debt (dbt test debt_account_only_receives_transfers).
        dimension: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: [savings, investment]
      - name: entry_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [photo, voice, text, import]
      - name: tags
        data_tests: [not_null]
      - name: needs_target_pct
        description: budget_targets' needs target as a fraction, the same on every row.
      - name: wants_target_pct
        description: budget_targets' wants target as a fraction, the same on every row.
      - name: financial_future_target_pct
        description: budget_targets' financial-future target as a fraction, the same on every row.
    # One metric per row of docs/SEMANTIC_LAYER.md's metric table, with the
    # same filter as its formula. A simple metric is null, not 0, in a month
    # with no matching rows: dbt 1.12.6 drops fill_nulls_with from metrics
    # written in this YAML spec. So the metrics built on others coalesce
    # their inputs, and a reader treats a null money metric as 0.
    metrics:
      - name: income
        type: simple
        agg: sum
        expr: amount
        filter: "{{ Dimension('line__type') }} = 'income'"
      - name: savings_income
        type: simple
        agg: sum
        expr: amount
        filter:
          - "{{ Dimension('line__type') }} = 'income'"
          - "{{ Dimension('line__deposit_account_name') }} is not null"
      - name: spend
        type: simple
        agg: sum
        expr: amount
        filter:
          - "{{ Dimension('line__type') }} = 'expense'"
          - "{{ Dimension('line__is_self_funded') }}"
      - name: needs_spend
        type: simple
        agg: sum
        expr: amount
        filter:
          - "{{ Dimension('line__type') }} = 'expense'"
          - "{{ Dimension('line__is_self_funded') }}"
          - "{{ Dimension('line__bucket') }} = 'needs'"
      - name: wants_spend
        type: simple
        agg: sum
        expr: amount
        filter:
          - "{{ Dimension('line__type') }} = 'expense'"
          - "{{ Dimension('line__is_self_funded') }}"
          - "{{ Dimension('line__bucket') }} = 'wants'"
      - name: fixed_base_burn
        type: simple
        agg: sum
        expr: amount
        filter:
          - "{{ Dimension('line__type') }} = 'expense'"
          - "{{ Dimension('line__is_self_funded') }}"
          - "{{ Dimension('line__bucket') }} = 'needs'"
          - "{{ Dimension('line__is_recurring') }}"
      - name: variable_needs
        type: simple
        agg: sum
        expr: amount
        filter:
          - "{{ Dimension('line__type') }} = 'expense'"
          - "{{ Dimension('line__is_self_funded') }}"
          - "{{ Dimension('line__bucket') }} = 'needs'"
          - "not {{ Dimension('line__is_recurring') }}"
      - name: external_spend
        type: simple
        agg: sum
        expr: amount
        filter:
          - "{{ Dimension('line__type') }} = 'expense'"
          - "not {{ Dimension('line__is_self_funded') }}"
      - name: transfers
        type: simple
        agg: sum
        expr: amount
        filter:
          - "{{ Dimension('line__type') }} = 'transfer'"
          - "{{ Dimension('line__from_account_name') }} is null"
          - "{{ Dimension('line__to_account_name') }} is not null"
      - name: withdrawals
        type: simple
        agg: sum
        expr: amount
        filter:
          - "{{ Dimension('line__type') }} = 'transfer'"
          - "{{ Dimension('line__from_account_name') }} is not null"
          - "{{ Dimension('line__to_account_name') }} is null"
      - name: unspent_rate
        type: derived
        expr: round((income - coalesce(spend, 0)) / nullif(income, 0), 4)
        input_metrics: [income, spend]
      # income - savings_income - spend - transfers + withdrawals, written as
      # one signed sum: MetricFlow 0.213 cannot query a cumulative metric
      # over a derived one, and unallocated_cash_cumulative needs this as
      # its input. check_metrics.py holds it to the mart's composed formula.
      - name: unallocated_cash
        type: simple
        agg: sum
        expr: >
          case
            when type = 'income' and deposit_account_name is null then amount
            when type = 'expense' and is_self_funded then -amount
            when type = 'transfer' and from_account_name is null
              and to_account_name is not null then -amount
            when type = 'transfer' and from_account_name is not null
              and to_account_name is null then amount
            else 0
          end
      - name: unallocated_cash_cumulative
        type: cumulative
        input_metric: unallocated_cash
        period_agg: last
      # Derived, not `type: ratio`: a ratio metric cannot coalesce its
      # numerator, so a month with wants and no needs would be null, not 0.
      - name: needs_wants_ratio
        type: derived
        expr: round(coalesce(needs_spend, 0) / nullif(wants_spend, 0), 4)
        input_metrics: [needs_spend, wants_spend]
      # The 50/30/20 view. A derived metric joins its inputs month by month,
      # so it is null in a month where none of its inputs has a row, even
      # one that coalesces them: spendable_income in a month with no income,
      # financial_future in one with nothing moved. The metrics built on
      # them coalesce them too.
      - name: spendable_income
        type: derived
        expr: coalesce(income, 0) - coalesce(savings_income, 0)
        input_metrics: [income, savings_income]
      - name: financial_future
        type: derived
        expr: coalesce(transfers, 0) - coalesce(withdrawals, 0)
        input_metrics: [transfers, withdrawals]
      # The targets are the same on every fct_transactions row, so max is
      # that value. A month with no transactions has none here, so
      # check_metrics.py does not compare a target there.
      - name: needs_target_pct
        type: simple
        agg: max
        expr: needs_target_pct
      - name: wants_target_pct
        type: simple
        agg: max
        expr: wants_target_pct
      - name: financial_future_target_pct
        type: simple
        agg: max
        expr: financial_future_target_pct
      - name: financial_future_target
        type: derived
        expr: round(financial_future_target_pct * coalesce(spendable_income, 0), 2)
        input_metrics: [financial_future_target_pct, spendable_income]
      - name: financial_future_gap
        type: derived
        expr: coalesce(financial_future_target, 0) - coalesce(financial_future, 0)
        input_metrics: [financial_future_target, financial_future]
      - name: needs_pct
        type: derived
        expr: round(coalesce(needs_spend, 0) / nullif(spendable_income, 0), 4)
        input_metrics: [needs_spend, spendable_income]
      - name: wants_pct
        type: derived
        expr: round(coalesce(wants_spend, 0) / nullif(spendable_income, 0), 4)
        input_metrics: [wants_spend, spendable_income]
      - name: financial_future_pct
        type: derived
        expr: round(coalesce(financial_future, 0) / nullif(spendable_income, 0), 4)
        input_metrics: [financial_future, spendable_income]
      - name: unallocated_pct
        type: derived
        expr: round(coalesce(unallocated_cash, 0) / nullif(spendable_income, 0), 4)
        input_metrics: [unallocated_cash, spendable_income]

  - name: fct_category_month
    description: >
      One row per (month_start, subcategory_id) with expense lines. spend,
      needs_spend and wants_spend use own spend lines; external_spend is
      the expenses someone else paid for; line_count counts both.
    data_tests:
      - unique:
          arguments:
            column_name: "month_start || '|' || subcategory_id"
    columns:
      - name: month_start
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: subcategory_id
        data_tests: [not_null]
      - name: category_name
        data_tests: [not_null]
      - name: subcategory_name
        data_tests: [not_null]
      - name: spend
        data_tests: [not_null]
      - name: needs_spend
        data_tests: [not_null]
      - name: wants_spend
        data_tests: [not_null]
      - name: external_spend
        data_tests: [not_null]
      - name: line_count
        data_tests: [not_null]

  - name: fct_monthly_summary
    description: >
      One row per month from the first data month to the current Toronto
      month (or a later month a row is dated in), zero-filled, with one
      column per metric in docs/SEMANTIC_LAYER.md. unspent_rate,
      needs_wants_ratio and the four *_pct shares of spendable_income are
      null when their denominator is 0. The three *_target_pct come from
      budget_targets and are the same every month.
    columns:
      - name: month_start
        data_tests: [unique, not_null]
      - name: income
        data_tests: [not_null]
      - name: savings_income
        data_tests: [not_null]
      - name: spend
        data_tests: [not_null]
      - name: needs_spend
        data_tests: [not_null]
      - name: wants_spend
        data_tests: [not_null]
      - name: fixed_base_burn
        data_tests: [not_null]
      - name: variable_needs
        data_tests: [not_null]
      - name: external_spend
        data_tests: [not_null]
      - name: transfers
        data_tests: [not_null]
      - name: withdrawals
        data_tests: [not_null]
      - name: unspent_rate
        data_tests:
          - not_null:
              config:
                where: "income <> 0"
      - name: unallocated_cash
        data_tests: [not_null]
      - name: unallocated_cash_cumulative
        data_tests: [not_null]
      - name: needs_wants_ratio
        data_tests:
          - not_null:
              config:
                where: "wants_spend <> 0"
      - name: spendable_income
        data_tests: [not_null]
      - name: financial_future
        data_tests: [not_null]
      # Null only if budget_targets lost its row.
      - name: needs_target_pct
        data_tests: [not_null]
      - name: wants_target_pct
        data_tests: [not_null]
      - name: financial_future_target_pct
        data_tests: [not_null]
      - name: financial_future_target
        data_tests: [not_null]
      - name: financial_future_gap
        data_tests: [not_null]
      # The four shares: null exactly when spendable_income is 0
      # (financial_future_identity).
      - name: needs_pct
      - name: wants_pct
      - name: financial_future_pct
      - name: unallocated_pct
      - name: transaction_count
        data_tests: [not_null]
      - name: is_complete_month
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

  # The planning marts (docs/SEMANTIC_LAYER.md, "Planning marts"): plans,
  # pace and baselines for the dashboards. Not metrics: no MetricFlow here.
  - name: fct_month_plan
    description: >
      One row per month from the ledger start's month on. Dollar plans from
      an expected income (the actual one in a complete month), the
      baseline of the up-to-3 complete months before, and rolling 3-month
      shares of complete months.
    columns:
      - name: month_start
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_monthly_summary')
                field: month_start
      - name: is_complete_month
        data_tests: [not_null]
      - name: days_in_month
        data_tests: [not_null]
      - name: as_of_day
        description: The month's last day if complete, today's day if current, 0 if later.
        data_tests: [not_null]
      - name: spendable_income
        data_tests: [not_null]
      - name: baseline_months
        description: Complete months among the 3 before this one (0 to 3).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
      - name: spendable_income_baseline
        description: Mean spendable_income of the baseline months; null with none.
      - name: spendable_income_expected
        description: >
          spendable_income in a complete month; otherwise the greater of
          income so far and the baseline, null with no baseline.
        data_tests:
          - not_null:
              config:
                where: "is_complete_month or baseline_months > 0"
      - name: income_received_share
      - name: needs_plan
      - name: wants_plan
      - name: financial_future_plan
      - name: needs_pct_3m
        description: Ratio of sums over this month and the 2 before, all complete; null otherwise.
      - name: wants_pct_3m
      - name: financial_future_pct_3m
      - name: unallocated_pct_3m

  - name: fct_pace_day
    description: >
      One row per (date_day, series) for every day of every month of
      fct_month_plan, five series each. Month-to-date per series, and the
      usual month-to-date and share of a month done at the matching day
      over the baseline months. Days after Toronto's today have no amount.
    data_tests:
      - unique:
          arguments:
            column_name: "date_day || '|' || series"
    columns:
      - name: date_day
        data_tests: [not_null]
      - name: month_start
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_month_plan')
                field: month_start
      - name: day_of_month
        data_tests: [not_null]
      - name: series
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [needs, wants, variable_needs, financial_future, spendable_income]
      - name: amount_day
        description: The series' sum that day, 0 with none; null after today.
      - name: amount_mtd
        description: Running sum within the month through that day; null after today.
      - name: month_total
        description: The series' month total, complete months only.
      - name: pace_mtd_avg_3m
        description: Mean of the baseline months' amount_mtd at the matching day.
      - name: pace_share_avg_3m
        description: >
          Mean of the baseline months' amount_mtd / month_total at the
          matching day, leaving out a month that totals 0.

  - name: fct_subcategory_month
    description: >
      One row per (month_start, bucket, subcategory_id) for every month of
      fct_month_plan and every (bucket, subcategory) pair with an own spend
      line in one of them, zero-filled. Own spend and line count, the
      baseline means over the up-to-3 complete months before (zeros
      included), the delta against it, and a few-lines flag.
    data_tests:
      - unique:
          arguments:
            column_name: "month_start || '|' || bucket || '|' || subcategory_id"
    columns:
      - name: month_start
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_month_plan')
                field: month_start
      - name: bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [needs, wants]
      - name: subcategory_id
        data_tests: [not_null]
      - name: category_name
        data_tests: [not_null]
      - name: subcategory_name
        data_tests: [not_null]
      - name: spend
        data_tests: [not_null]
      - name: line_count
        description: Own lines only, unlike fct_category_month.line_count.
        data_tests: [not_null]
      - name: baseline_months
        data_tests: [not_null]
      - name: spend_avg_3m
        description: Mean spend over the baseline months, zeros included; null with none.
      - name: line_count_avg_3m
      - name: spend_delta
        description: spend - spend_avg_3m; null with no baseline.
      - name: is_few_lines
        description: Fewer than 6 lines across this month and 3 baseline months' worth.
        data_tests: [not_null]
