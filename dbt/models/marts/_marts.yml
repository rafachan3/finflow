version: 2

# The marts docs/SEMANTIC_LAYER.md defines. Generic tests here; the money
# reconciliations are singular tests in dbt/tests/.

models:
  - name: dim_date
    description: One row per day from the first data month to a year past Toronto's today.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: month_start
        data_tests: [not_null]

  - name: fct_transactions
    description: >
      One row per ledger line: each expense line, plus one row per income or
      transfer transaction (its header stands in for its line). amount is the
      line amount, or the header amount for income and transfers. tags holds
      the line's effective tags (its own plus its transaction's). A null
      account name is chequing: deposit_account_name on income,
      from_account_name and to_account_name on a transfer.
    columns:
      - name: line_key
        data_tests: [unique, not_null]
      - name: transaction_id
        data_tests: [not_null]
      - name: occurred_on
        description: Every ledger date falls inside the time spine.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: amount
        data_tests: [not_null]
      - name: type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [income, expense, transfer]
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: [CAD]
      - name: bucket
        data_tests:
          - not_null:
              config:
                where: "type = 'expense'"
          - accepted_values:
              arguments:
                values: [needs, wants]
      - name: is_self_funded
        data_tests:
          - not_null:
              config:
                where: "type = 'expense'"
      - name: subcategory_id
        data_tests:
          - not_null:
              config:
                where: "type = 'expense'"
      - name: account_kind
        description: Kind of the account a transfer enters (to_account_name).
        data_tests:
          - accepted_values:
              arguments:
                values: [savings, investment]
      - name: from_account_kind
        description: Kind of the account a transfer leaves (from_account_name).
        data_tests:
          - accepted_values:
              arguments:
                values: [savings, investment]
      - name: entry_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [photo, voice, text, import]
      - name: tags
        data_tests: [not_null]

  - name: fct_category_month
    description: >
      One row per (month_start, subcategory_id) with expense lines. spend,
      needs_spend and wants_spend use own spend lines; external_spend is
      the expenses someone else paid for; line_count counts both.
    data_tests:
      - unique:
          arguments:
            column_name: "month_start || '|' || subcategory_id"
    columns:
      - name: month_start
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: subcategory_id
        data_tests: [not_null]
      - name: category_name
        data_tests: [not_null]
      - name: subcategory_name
        data_tests: [not_null]
      - name: spend
        data_tests: [not_null]
      - name: needs_spend
        data_tests: [not_null]
      - name: wants_spend
        data_tests: [not_null]
      - name: external_spend
        data_tests: [not_null]
      - name: line_count
        data_tests: [not_null]

  - name: fct_monthly_summary
    description: >
      One row per month from the first data month to the current Toronto
      month (or a later month a row is dated in), zero-filled, with one
      column per metric in docs/SEMANTIC_LAYER.md. savings_rate and
      needs_wants_ratio are null when their denominator is 0.
    columns:
      - name: month_start
        data_tests: [unique, not_null]
      - name: income
        data_tests: [not_null]
      - name: savings_income
        data_tests: [not_null]
      - name: spend
        data_tests: [not_null]
      - name: needs_spend
        data_tests: [not_null]
      - name: wants_spend
        data_tests: [not_null]
      - name: fixed_base_burn
        data_tests: [not_null]
      - name: variable_needs
        data_tests: [not_null]
      - name: external_spend
        data_tests: [not_null]
      - name: transfers
        data_tests: [not_null]
      - name: withdrawals
        data_tests: [not_null]
      - name: savings_rate
        data_tests:
          - not_null:
              config:
                where: "income <> 0"
      - name: unallocated_cash
        data_tests: [not_null]
      - name: unallocated_cash_cumulative
        data_tests: [not_null]
      - name: needs_wants_ratio
        data_tests:
          - not_null:
              config:
                where: "wants_spend <> 0"
      - name: transaction_count
        data_tests: [not_null]
      - name: is_complete_month
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
