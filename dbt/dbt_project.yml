name: finflow
version: "1.0.0"
profile: finflow

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

flags:
  send_anonymous_usage_stats: false

vars:
  # The first day the ledger covers (DECISIONS 2026-08-13 and 2026-11-02);
  # occurred_on_within_ledger fails a row dated before it. The synthetic
  # fixture starts earlier, so test_db.py exports its own start.
  ledger_start: "{{ env_var('FINFLOW_LEDGER_START', '2026-06-01') }}"
  # Toronto's today, fixed (toronto_today). Empty means the real today;
  # only test_db.py sets it, so the fixture's current month never moves.
  today: "{{ env_var('FINFLOW_TODAY', '') }}"

models:
  finflow:
    staging:
      +schema: staging
      +materialized: view
    # Tables rebuilt in full on every run, never incremental: a late or
    # backfilled row dated in a past month changes that month on the next
    # build. The analyst's SELECT comes from migration 0013's default
    # privilege, not from a dbt grants config (DECISIONS 2026-10-29).
    marts:
      +schema: marts
      +materialized: table
