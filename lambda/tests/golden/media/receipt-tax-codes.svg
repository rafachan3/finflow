<?xml version="1.0" encoding="UTF-8"?>
<!-- Synthetic Quebec grocery receipt: FP marks the lines taxed with GST and QST, the unmarked line is zero-rated; the store is fictional. See README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600">
  <rect width="420" height="600" fill="#ffffff"/>
  <g font-family="Courier New, Courier, monospace" font-size="18" fill="#111111">
    <text x="210" y="50" font-size="26" font-weight="bold" text-anchor="middle">PINEWOOD GROCER</text>
    <text x="210" y="80" text-anchor="middle">Store #118</text>
    <text x="30" y="125">Date: 2026-10-25  14:32</text>
    <text x="30" y="150">Cashier: 4</text>
    <line x1="30" y1="170" x2="390" y2="170" stroke="#111111" stroke-dasharray="6 4"/>
    <text x="30" y="205">TRAIL MIX</text><text x="350" y="205" text-anchor="end">7.49</text><text x="362" y="205">FP</text>
    <text x="30" y="235">BANANAS</text><text x="350" y="235" text-anchor="end">1.95</text>
    <text x="30" y="265">SPARKLING WATER</text><text x="350" y="265" text-anchor="end">6.99</text><text x="362" y="265">FP</text>
    <line x1="30" y1="290" x2="390" y2="290" stroke="#111111" stroke-dasharray="6 4"/>
    <text x="30" y="325">SUBTOTAL</text><text x="350" y="325" text-anchor="end">16.43</text>
    <text x="30" y="355">GST 5%</text><text x="350" y="355" text-anchor="end">0.72</text>
    <text x="30" y="385">QST 9.975%</text><text x="350" y="385" text-anchor="end">1.44</text>
    <text x="30" y="425" font-size="22" font-weight="bold">TOTAL</text><text x="350" y="425" font-size="22" font-weight="bold" text-anchor="end">18.59</text>
    <text x="30" y="465">DEBIT</text><text x="350" y="465" text-anchor="end">18.59</text>
    <text x="30" y="510" font-size="15">FP = GST + QST TAXABLE</text>
    <text x="210" y="560" text-anchor="middle">THANK YOU</text>
  </g>
</svg>
