<?xml version="1.0" encoding="UTF-8"?>
<!-- Synthetic housewares receipt with a member discount on the whole order, then GST and QST on the discounted subtotal; the store is fictional. See README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="640" viewBox="0 0 420 640">
  <rect width="420" height="640" fill="#ffffff"/>
  <g font-family="Courier New, Courier, monospace" font-size="18" fill="#111111">
    <text x="210" y="50" font-size="26" font-weight="bold" text-anchor="middle">COPPER KETTLE</text>
    <text x="210" y="80" text-anchor="middle">Housewares #07</text>
    <text x="30" y="125">Date: 2026-10-27  15:20</text>
    <text x="30" y="150">Cashier: 2</text>
    <line x1="30" y1="170" x2="390" y2="170" stroke="#111111" stroke-dasharray="6 4"/>
    <text x="30" y="205">WOODEN SPOON</text><text x="390" y="205" text-anchor="end">6.00</text>
    <text x="30" y="235">DISH TOWEL</text><text x="390" y="235" text-anchor="end">8.00</text>
    <text x="30" y="265">MIXING BOWL</text><text x="390" y="265" text-anchor="end">16.00</text>
    <line x1="30" y1="290" x2="390" y2="290" stroke="#111111" stroke-dasharray="6 4"/>
    <text x="30" y="325">SUBTOTAL</text><text x="390" y="325" text-anchor="end">30.00</text>
    <text x="30" y="355">MEMBER 10% OFF</text><text x="390" y="355" text-anchor="end">-3.00</text>
    <text x="30" y="385">GST 5%</text><text x="390" y="385" text-anchor="end">1.35</text>
    <text x="30" y="415">QST 9.975%</text><text x="390" y="415" text-anchor="end">2.69</text>
    <text x="30" y="455" font-size="22" font-weight="bold">TOTAL</text><text x="390" y="455" font-size="22" font-weight="bold" text-anchor="end">31.04</text>
    <text x="30" y="490">DEBIT</text><text x="390" y="490" text-anchor="end">31.04</text>
    <text x="210" y="560" text-anchor="middle">THANK YOU</text>
  </g>
</svg>
