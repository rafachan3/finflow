name: CI

# No path filter: required checks must report on every PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lambda/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run bundle

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: lambda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lambda/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  # The golden cases. Always reports; runs only when the diff touches a path
  # in lambda/eval/harness.ts (RELEVANT), and then calls Gemini only for a
  # case whose request differs from its recorded pass (docs/TESTING.md).
  eval:
    runs-on: ubuntu-latest
    # Cases plus up to 20 minutes waiting out a Gemini outage.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      EVAL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    defaults:
      run:
        working-directory: lambda
    steps:
      - uses: actions/checkout@v4
        with:
          # The relevance check diffs against the base commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lambda/package-lock.json
      - run: npm ci
      # Only this step sees the key, not checkout or npm ci's install scripts.
      # --record rewrites each live pass's golden; CI cannot commit, so the
      # files go up as the `goldens` artifact for the PR to commit.
      - run: npm run eval -- --record
        env:
          GEMINI_EVAL_API_KEY: ${{ secrets.GEMINI_EVAL_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldens
          path: lambda/tests/golden/*.json
          retention-days: 7

  # Every behaviour in docs/TESTING.md cites a test that exists, and the
  # whole suite stays above the coverage floor in lambda/vitest.config.ts.
  inventory:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lambda/package-lock.json
      - run: node scripts/check-inventory.mjs
      - run: npm ci
        working-directory: lambda
      - run: npm run test:coverage
        working-directory: lambda
