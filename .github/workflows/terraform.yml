name: Terraform

# Formatting and validation of infra/ only: no credentials, no backend,
# never a plan or apply. Not a required check, and a workflow of its own:
# the deploy waits for the whole CI run to succeed, so a red job there
# would hold back Lambda deploys.
on:
  pull_request:
    paths:
      - "infra/**"
      - "grafana/dashboards/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      # init downloads each provider and its signature from github.com, which
      # returns 504 now and then. Cache the downloads (keyed by the lock file)
      # and retry a cold init, so an outage there does not turn the check red.
      # Every step must see the same cache dir: init links providers into it, and
      # a later init without it cannot replace those links.
      - name: Share one plugin cache dir
        run: echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tf-plugin-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tf-plugin-cache
          key: terraform-providers-${{ hashFiles('infra/.terraform.lock.hcl') }}
      - name: terraform init, with retries
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for attempt in 1 2 3 4 5; do
            terraform -chdir=infra init -backend=false -input=false -lockfile=readonly && exit 0
            echo "init attempt $attempt failed; retrying"
            sleep $((attempt * 30))
          done
          exit 1
      - name: terraform fmt -check and validate on infra
        run: make terraform-check
