name: Deploy ingest Lambda

# Deploys only after CI is green on the commit that landed on main.
# workflow_run has no path filter, so every green push to main redeploys;
# redeploying unchanged code is harmless.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lambda/package-lock.json
      - run: npm ci
      - run: npm run bundle
      - name: Zip bundle
        run: (cd dist && zip -j ../ingest.zip index.js)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INGEST_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Update function code
        run: |
          aws lambda update-function-code \
            --function-name finflow-ingest \
            --zip-file fileb://ingest.zip
      - name: Smoke test (wrong secret must get 401)
        run: |
          aws lambda wait function-updated --function-name finflow-ingest
          url=$(aws lambda get-function-url-config \
            --function-name finflow-ingest \
            --query FunctionUrl --output text)
          echo "::add-mask::$url"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url" \
            -H 'content-type: application/json' \
            -H 'x-telegram-bot-api-secret-token: smoke-test-wrong-secret' \
            -d '{}')
          echo "wrong-secret request returned HTTP $code"
          test "$code" = 401
