name: dbt nightly

# `dbt build` and the metric check against PRODUCTION, as finflow_dbt
# (docs/TESTING.md, "The nightly dbt build"). The marts are rebuilt in full,
# so late and backfilled rows land in their month on the next run.
#
# Only schedule and workflow_dispatch: the FINFLOW_DBT_* secrets must never
# be reachable from pull_request code (the repo is public and takes fork
# PRs). Never add a pull_request, pull_request_target or workflow_run
# trigger here.
#
# 08:45 UTC is 04:45 EDT and 03:45 EST, so Toronto's day has turned in both
# and the run is done before the owner's morning. It is 30 minutes after
# eval-nightly; the two share nothing. :45 keeps off the top-of-hour load on
# which GitHub delays scheduled runs.
#
# The log is public, so it carries names and statuses only: dbt's own output
# (row counts, failing-test counts, database error text, which can quote a
# row) goes to a runner file that is never printed or uploaded.
on:
  schedule:
    - cron: "45 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency: dbt-nightly

jobs:
  # A job's `if` cannot read secrets, so this job checks for them and the
  # build job runs only when all three are set. On a fork, or before the
  # secrets exist, the build job is skipped and the run is green.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          PRESENT: ${{ secrets.FINFLOW_DBT_HOST != '' && secrets.FINFLOW_DBT_USER != '' && secrets.FINFLOW_DBT_PASSWORD != '' }}
        run: |
          echo "present=$PRESENT" >> "$GITHUB_OUTPUT"
          [ "$PRESENT" = true ] || echo "::notice::FINFLOW_DBT_* secrets are not set; skipping the production build"

  build:
    needs: secrets
    if: needs.secrets.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Supabase's session pooler; TLS verified against its public root CA.
      # libpq reads PGSSLROOTCERT for dbt, mf and check_metrics.py alike.
      FINFLOW_DBT_PORT: "5432"
      FINFLOW_DBT_DBNAME: postgres
      FINFLOW_DBT_SSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/supabase/prod-ca-2021.crt
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    defaults:
      run:
        working-directory: dbt
        # Explicit bash adds pipefail, so a failure piped into tee still fails.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt
      - run: pip install -r requirements.txt

      # The secrets are on the three steps that connect, not on checkout or
      # pip's install scripts. GitHub masks secret values already; the
      # project ref inside the user name is masked on its own as well.
      - name: Connect to production as finflow_dbt
        id: connect
        env:
          FINFLOW_DBT_HOST: ${{ secrets.FINFLOW_DBT_HOST }}
          FINFLOW_DBT_USER: ${{ secrets.FINFLOW_DBT_USER }}
          FINFLOW_DBT_PASSWORD: ${{ secrets.FINFLOW_DBT_PASSWORD }}
        run: |
          echo "::add-mask::$FINFLOW_DBT_HOST"
          echo "::add-mask::$FINFLOW_DBT_USER"
          echo "::add-mask::${FINFLOW_DBT_USER#*.}"
          echo "::add-mask::$FINFLOW_DBT_PASSWORD"
          dbt debug --connection

      # The fixture tag marks tests that compare against the synthetic
      # fixture's hand-worked values; the invariants and the reconciliation
      # to public run here.
      - name: dbt build on production, without the fixture tests
        id: build
        env:
          FINFLOW_DBT_HOST: ${{ secrets.FINFLOW_DBT_HOST }}
          FINFLOW_DBT_USER: ${{ secrets.FINFLOW_DBT_USER }}
          FINFLOW_DBT_PASSWORD: ${{ secrets.FINFLOW_DBT_PASSWORD }}
        run: |
          status=0
          dbt build --exclude tag:fixture > "$RUNNER_TEMP/dbt-build.log" 2>&1 || status=$?
          if [ -f target/run_results.json ]; then
            jq -r '.results[] | "\(.status)\t\(.unique_id)"' target/run_results.json
          else
            echo "dbt build wrote no run_results.json"
          fi
          echo "dbt build exited $status; its output is withheld from this public log"
          exit "$status"

      - name: mf validate-configs and check_metrics.py on production
        id: metrics
        env:
          FINFLOW_DBT_HOST: ${{ secrets.FINFLOW_DBT_HOST }}
          FINFLOW_DBT_USER: ${{ secrets.FINFLOW_DBT_USER }}
          FINFLOW_DBT_PASSWORD: ${{ secrets.FINFLOW_DBT_PASSWORD }}
        run: |
          if ! mf validate-configs > "$RUNNER_TEMP/mf.log" 2>&1; then
            echo "mf validate-configs failed" | tee "$RUNNER_TEMP/metrics.txt"
            exit 1
          fi
          # check_metrics.py prints metric and month names only; its stderr
          # (mf's error text) is withheld.
          python scripts/check_metrics.py 2> "$RUNNER_TEMP/metrics.err" | tee "$RUNNER_TEMP/metrics.txt"

      # One open issue at most: a failure opens it or comments on it, a pass
      # closes it. GitHub notifies the owner of both. Names only, no values.
      - name: Open or update the dbt-nightly issue
        if: failure()
        env:
          CONNECT: ${{ steps.connect.outcome }}
          BUILD: ${{ steps.build.outcome }}
          METRICS: ${{ steps.metrics.outcome }}
          SUMMARY: ${{ runner.temp }}/summary.md
        run: |
          {
            echo "The nightly production dbt build failed. Names only; rerun it locally with the FINFLOW_DBT_* variables (docs/TESTING.md, \"The nightly dbt build\") to see the detail."
            echo
            echo "| Failed | Status |"
            echo "|---|---|"
            [ "$CONNECT" != failure ] || echo "| connection as finflow_dbt | failure |"
            if [ "$BUILD" = failure ]; then
              if [ -f target/run_results.json ]; then
                jq -r '.results[] | select(.status == "fail" or .status == "error")
                  | "| `\(.unique_id)` | \(.status) |"' target/run_results.json
              else
                echo "| dbt build (no run_results.json) | failure |"
              fi
            fi
            if [ "$METRICS" = failure ]; then
              if [ -s "$RUNNER_TEMP/metrics.txt" ]; then
                sed 's/^/| /; s/$/ | failure |/' "$RUNNER_TEMP/metrics.txt"
              else
                echo "| check_metrics.py | failure |"
              fi
            fi
            case "$CONNECT$BUILD$METRICS" in
              *failure*) ;;
              *) echo "| a setup step (see the run) | failure |" ;;
            esac
            printf '\n%s\n' "Run: $RUN_URL"
          } > "$SUMMARY"
          gh label create dbt-nightly --color B60205 --description "The nightly production dbt build failed" --force
          issue=$(gh issue list --label dbt-nightly --state open --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$SUMMARY"
          else
            gh issue create --label dbt-nightly --title "Nightly dbt build failing" --body-file "$SUMMARY"
          fi
      - name: Close the dbt-nightly issue
        if: success()
        run: |
          for issue in $(gh issue list --label dbt-nightly --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --reason completed --comment "Passed: $RUN_URL"
          done
